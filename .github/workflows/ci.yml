# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          swift --version

      # The acceptance fixture extension is rebuilt from its own source rather than trusted as a
      # committed binary. It carries a local patch to its page classifier
      # (docs/FIXTURE_EXTENSION_PATCH.md), so the archive the tests and the device build use has to be
      # the one that source produces. Its own test suite runs first: this repository does not own that
      # extension, and a patch to it has to answer to its tests before it reaches ours.
      - name: Rebuild the acceptance fixture extension
        run: |
          set -euo pipefail
          root=Tsuyomi-main/tsuyomi-extensions
          if [ ! -d "$root/src" ]; then
            echo "extension source not mirrored; keeping the archive as checked out"
            exit 0
          fi
          node --version
          (cd "$root" && npm ci && npm test && npm run package:fixture)
          (cd "$root/fixtures/wenku8" && shasum -a 256 -c wenku8-fixture.sha256)

      - name: Resolve simulator destination
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          rows = [(rt, dev) for rt, devs in devices.items() if 'iOS' in rt for dev in devs]
          rows.sort(key=lambda r: r[0])
          print(rows[-1][1]['udid'] if rows else '')
          ")
          if [ -z "$udid" ]; then echo "no iOS simulator available" >&2; exit 1; fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Resolve package scheme
        id: scheme
        run: |
          set -euo pipefail
          xcodebuild -list -json
          name=$(xcodebuild -list -json | python3 -c "
          import json, sys
          schemes = json.load(sys.stdin)['workspace']['schemes']
          print('Tsuyomi-Package' if 'Tsuyomi-Package' in schemes else schemes[0])
          ")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Test (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            -resultBundlePath TestResults.xcresult

      # Warnings are already errors in the package build above, which compiles every Swift file we
      # own. Xcode builds package targets of an app with -suppress-warnings, which conflicts with
      # -warnings-as-errors, so this step only proves the app links and launches.
      - name: Build app target (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/Tsuyomi.xcodeproj \
            -scheme Tsuyomi \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation

      # An unsigned device build for sideloading (TrollStore and similar install unsigned payloads
      # themselves). Debug configuration on purpose: it is the only one that trusts the acceptance
      # fixture publisher, so a test extension can be imported without a repository to point at.
      - name: Package unsigned device build
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/Tsuyomi.xcodeproj \
            -scheme Tsuyomi \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DeviceBuild \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_DEBUG_DYLIB=NO ENABLE_PREVIEWS=NO \
            "CURRENT_PROJECT_VERSION=${{ github.run_number }}"
          mkdir -p Payload
          cp -R DeviceBuild/Build/Products/Debug-iphoneos/Tsuyomi.app Payload/
          # A sideloaded app must be one ordinary binary: Xcode's debug-dylib split leaves the code in
          # a separate unsigned dylib that an install without a developer certificate cannot load.
          test ! -e Payload/Tsuyomi.app/Tsuyomi.debug.dylib
          zip -qry Tsuyomi-unsigned.ipa Payload
          unzip -l Tsuyomi-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tsuyomi-unsigned-ipa
          path: Tsuyomi-unsigned.ipa
          if-no-files-found: error

      # Published beside the app because the two have to match: this archive is signed with the
      # published fixture seed, which only a Debug build trusts.
      - name: Upload the acceptance fixture extension
        uses: actions/upload-artifact@v4
        with:
          name: wenku8-fixture-hxp
          path: Tsuyomi-main/tsuyomi-extensions/fixtures/wenku8/wenku8-fixture.hxp
          if-no-files-found: error

      # Screens rendered by InterfaceSnapshotTests. There is no device in this loop, so these are how
      # a layout is looked at before it reaches one.
      - name: Upload interface snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceSnapshots
          path: SnapshotOutput
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
